name: QuranTopics Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java for Datastore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Cloud SDK with Datastore Emulator
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta,cloud-datastore-emulator'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        env:
          DATASTORE_EMULATOR_HOST: localhost:8081
          APPLICATION_ID: dev~qurantopics
          GOOGLE_CLOUD_PROJECT: qurantopics
        run: |
          gcloud beta emulators datastore start --host-port=127.0.0.1:8081 --no-store-on-disk --consistency=1.0 &
          # Wait for emulator to be ready
          until curl -s http://127.0.0.1:8081/ > /dev/null; do sleep 0.5; done
          pytest --cov=controllers --cov-report=term-missing
